name: pramaan-chain

x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  restart: unless-stopped
  init: true

x-contract-tool: &contract-tool
  image: pramaan-chain-contract-tools:${SOURCE_COMMIT:-unconfigured}
  build:
    context: https://github.com/prabinpkrl/pramaan-chain-smart-contracts.git#${SOURCE_COMMIT:-REPLACE_WITH_FULL_40_CHARACTER_GIT_COMMIT_SHA}
    dockerfile: docker/contract-tools.Dockerfile
    args:
      SOURCE_COMMIT: ${SOURCE_COMMIT:-REPLACE_WITH_FULL_40_CHARACTER_GIT_COMMIT_SHA}
    provenance: mode=max
  profiles: ["deploy"]
  environment:
    SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:?Set SEPOLIA_RPC_URL in .env.docker}
    SOURCE_COMMIT: ${SOURCE_COMMIT:-REPLACE_WITH_FULL_40_CHARACTER_GIT_COMMIT_SHA}
    DEPLOYMENT_RUNTIME_PATH: /workspace/.docker-state/runtime.env
    DEPLOYMENT_EVIDENCE_PATH: /workspace/.docker-state/deployment.json
    ALLOW_NEW_DEPLOYMENT: ${ALLOW_NEW_DEPLOYMENT:-false}
    ALLOW_RUNTIME_OVERWRITE: ${ALLOW_RUNTIME_OVERWRITE:-false}
    ALLOW_AUTHORIZATION_RESUBMIT: ${ALLOW_AUTHORIZATION_RESUBMIT:-false}
    AUTHORIZATION_RETRY_CONFIRMATION: ${AUTHORIZATION_RETRY_CONFIRMATION:-}
  volumes:
    - hardhat_keystore:/home/node/.config/hardhat-nodejs
    - deployment_state:/workspace/.docker-state
  depends_on:
    deployment-volumes-init:
      condition: service_completed_successfully
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stdin_open: true
  tty: true

services:
  gateway:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      provenance: mode=max
    environment:
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:?Set SEPOLIA_RPC_URL in .env.docker}
      DEPLOYMENT_RUNTIME_PATH: /run/pramaan/runtime.env
      CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:5173}
      BLOCKCHAIN_NETWORK: sepolia
      BLOCKCHAIN_CONFIRMATIONS: "2"
      TRUST_PROXY: "false"
      IDEMPOTENCY_STORE_PATH: /app/.data/idempotency.json
      ISSUER_ADDRESS: ""
      ISSUER_PRIVATE_KEY: ""
      WRITE_API_KEY: ""
      PORT: "3000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    volumes:
      - gateway_data:/app/.data
      - deployment_state:/run/pramaan:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app-backend:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/app-backend.Dockerfile
      provenance: mode=max
    environment:
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:?Set SEPOLIA_RPC_URL in .env.docker}
      DEPLOYMENT_RUNTIME_PATH: /run/pramaan/runtime.env
      APP_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:5173}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost:5173}
      DATABASE_PATH: /app/.data/pramaan-app.sqlite
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "4000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_BACKEND_PORT:-4000}:4000"
    volumes:
      - app_data:/app/.data
      - deployment_state:/run/pramaan:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      provenance: mode=max
    environment:
      DEPLOYMENT_RUNTIME_PATH: /run/pramaan/runtime.env
      VITE_APP_API_URL: http://localhost:${APP_BACKEND_PORT:-4000}/api
      VITE_BLOCKCHAIN_API_URL: http://localhost:${GATEWAY_PORT:-3000}/api
      VITE_ETHERSCAN_BASE_URL: https://sepolia.etherscan.io
      VITE_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    volumes:
      - deployment_state:/run/pramaan:ro
    depends_on:
      gateway:
        condition: service_healthy
      app-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

  deployment-volumes-init:
    image: busybox:1.37.0
    profiles: ["deploy"]
    user: "0:0"
    command:
      - sh
      - -eu
      - -c
      - |
        chown 1000:1000 /state /keystore
        chmod 0755 /state
        chmod 0700 /keystore
    volumes:
      - deployment_state:/state
      - hardhat_keystore:/keystore
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  contract-tools:
    <<: *contract-tool

  deploy-contract:
    <<: *contract-tool
    command: ["npm", "run", "docker:deploy"]

  resume-authorization:
    <<: *contract-tool
    command: ["npm", "run", "sepolia:resume-authorize"]

  configure-existing:
    <<: *contract-tool
    environment:
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:?Set SEPOLIA_RPC_URL in .env.docker}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-REPLACE_WITH_FULL_40_CHARACTER_GIT_COMMIT_SHA}
      DEPLOYMENT_RUNTIME_PATH: /workspace/.docker-state/runtime.env
      DEPLOYMENT_EVIDENCE_PATH: /workspace/.docker-state/deployment.json
      ALLOW_RUNTIME_OVERWRITE: ${ALLOW_RUNTIME_OVERWRITE:-false}
      BLOCKCHAIN_CHAIN_ID: "11155111"
      IMPORT_CONTRACT_ADDRESS: ${IMPORT_CONTRACT_ADDRESS:-}
      IMPORT_DEPLOYMENT_BLOCK: ${IMPORT_DEPLOYMENT_BLOCK:-}
      IMPORT_ADMINISTRATOR_ADDRESS: ${IMPORT_ADMINISTRATOR_ADDRESS:-}
      IMPORT_ISSUER_ADDRESS: ${IMPORT_ISSUER_ADDRESS:-}
    command: ["npm", "run", "docker:configure-existing"]

volumes:
  app_data:
  deployment_state:
  gateway_data:
  hardhat_keystore:
